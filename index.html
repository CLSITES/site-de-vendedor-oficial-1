           1. MÓDULO DE CORES DO TEMA (ALTERE AQUI)
           ========================================= */
        :root {
            --theme-primary: #e60000; /* Vermelho principal */
            --theme-dark: #4a0000;    /* Vermelho escuro/Vinho */
            --theme-glow: #ffaa00;    /* Laranja para luzes/brilho */
            --theme-accent: #ffcc00;  /* Amarelo dourado para destaques */
            --card-white: #ffffff;
            --bg-dark: #1b0000;       /* Fundo da página */
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--theme-dark) 100%);
            color: #fff;
            overflow-x: hidden;
        }

        /* FUNDO DE PARTÍCULAS (Canvas) */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.6;
        }

        header {
            background: rgba(10, 0, 0, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid transparent;
            border-image: linear-gradient(to right, var(--theme-primary), var(--theme-glow), var(--theme-accent), var(--theme-primary)) 1;
            position: sticky;
            top: 0; z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .logo-campanha {
            height: 45px;
            filter: drop-shadow(0 0 5px var(--theme-glow));
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* AREA DO VENDEDOR NO TOPO */
        .vendedor-topo {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 40px 5% 10px 5%;
            position: relative;
        }

        .vendedor-moldura {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--theme-primary), var(--theme-glow), var(--theme-accent));
            padding: 4px;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.4);
            animation: pulseTech 2s infinite;
        }

        .vendedor-moldura img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            background: #fff;
        }

        .vendedor-info {
            display: flex;
            flex-direction: column;
        }

        .vendedor-info .cargo {
            font-size: 0.8rem;
            color: var(--theme-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255, 170, 0, 0.3);
        }

        .vendedor-info .nome-vendedor {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0px var(--theme-dark);
        }

        /* BOTÃO DO INSTAGRAM */
        .btn-insta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 16px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(220, 39, 67, 0.4);
            transition: transform 0.2s;
        }

        .btn-insta:hover {
            transform: scale(1.05);
        }

        .btn-insta svg { width: 16px; height: 16px; fill: currentColor; }

        @keyframes pulseTech {
            0% { box-shadow: 0 0 15px var(--theme-primary); transform: scale(1); }
            50% { box-shadow: 0 0 30px var(--theme-glow); transform: scale(1.05); }
            100% { box-shadow: 0 0 15px var(--theme-primary); transform: scale(1); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .section-title {
            text-align: center;
            font-weight: 900;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin: 40px 0 60px 0;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--theme-accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 2px dashed var(--theme-glow);
            padding-bottom: 20px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .moto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .moto-card {
            background: var(--card-white);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }
        
        .moto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 170, 0, 0.2);
        }

        .moto-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(to right, var(--theme-primary), var(--theme-glow), var(--theme-accent));
            z-index: 20;
        }

        .moto-stage {
            height: 250px;
            background: radial-gradient(circle at center, #ffffff 0%, #fff4cc 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .placa-ano {
            position: absolute;
            top: 15px; left: 15px;
            background: var(--theme-dark);
            color: var(--theme-accent);
            padding: 5px 15px;
            font-weight: 900;
            border-radius: 5px;
            font-size: 0.8rem;
            z-index: 10;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            border: 1px solid var(--theme-glow);
            letter-spacing: 1px;
        }

        .decoracao-pendurada {
            position: absolute;
            top: 0; right: 20px;
            width: 120px;
            animation: floating 4s ease-in-out infinite;
            z-index: 5;
            filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.2));
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(10px); }
        }

        .moto-img {
            width: 85%;
            z-index: 3;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.1));
            transition: opacity 0.2s;
        }

        .burnout-smoke {
            position: absolute;
            bottom: 40px; left: 50%;
            width: 100px; height: 40px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.4) 0%, transparent 70%);
            filter: blur(10px);
            opacity: 0;
            z-index: 2;
        }

        .pneu-mark {
            position: absolute;
            bottom: 50px; left: 45%;
            width: 0; height: 8px;
            background: #222;
            border-radius: 10px;
            opacity: 0.6;
            z-index: 1;
        }

        .animate-drive { 
            animation: driveLoop 1.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; 
        }
        
        @keyframes driveLoop {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            10% { transform: translateX(-30px) rotate(-2deg); } 
            45% { transform: translateX(130vw) scale(1); opacity: 1; }
            46% { opacity: 0; transform: translateX(-130vw) scale(1); }
            48% { opacity: 1; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        .card-info { padding: 25px; color: #111; text-align: center; background: #fff; }
        .moto-name { font-size: 1.5rem; font-weight: 900; margin: 0; color: var(--theme-dark); }
        .moto-price { color: var(--theme-primary); font-size: 1.3rem; font-weight: 800; margin: 10px 0; }

        .btn-box { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action {
            flex: 1; padding: 15px; border-radius: 5px;

            border: 1px solid var(--theme-primary);
        }
        .btn-fin:hover { background: var(--theme-dark); transform: scale(1.05); }

        .btn-cons { 
            background: #fff; color: var(--theme-primary); 
            border: 2px solid var(--theme-primary);
        }
        .btn-cons:hover { background: var(--theme-primary); color: #fff; transform: scale(1.05); }

        .agente-ia {
            position: fixed;
            right: 24px; bottom: 24px;

        .agente-texto strong { color: #fff; font-size: 14px; display: block; }
        .agente-texto span { color: #eafff3; font-size: 12px; }

        @media(max-width:768px){

            .agente-texto { display: none; }
            .section-title { font-size: 2rem; margin: 20px 0; }
            header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .header-right { align-items: flex-start; text-align: left; }
        }
    </style>
</head>

document.getElementById('logo-campanha').src = CONFIG_TEMA.logoURL;
document.getElementById('tema-label').innerText = CONFIG_TEMA.nomeCampanha;
document.getElementById('titulo-principal').innerText = CONFIG_TEMA.tituloSite;

function renderCards() {
    const grid = document.getElementById('motoGrid');
    MOTOS.forEach((m, index) => {
        const card = document.createElement('div');
        card.className = 'moto-card';
        card.innerHTML = `
            <div class="moto-stage" onclick="executarAnimacao(this, ${index})" data-current-img="0">
                <div class="placa-ano">${CONFIG_TEMA.tagMiniatura}</div>
                <img src="${CONFIG_TEMA.enfeiteIcone}" class="decoracao-pendurada">
                <div class="burnout-smoke"></div>
                <div class="pneu-mark"></div>
                <img src="${m.imgs[0]}" class="moto-img">
            </div>
            <div class="card-info">
                <h3 class="moto-name">${m.nome}</h3>
                <div class="moto-price">À vista ${m.precoAvista}</div>

                <div class="btn-box">
                    <a href="financiamento.html?moto=${m.id}" class="btn-action btn-fin">Financiar</a>
                    <a href="Consórcio.html?moto=${m.id}" class="btn-action btn-cons">Consórcio</a>
                </div>
            </div>`;
        grid.appendChild(card);
    });
}

function executarAnimacao(stage, motoIndex) {
    const motoImgElement = stage.querySelector('.moto-img');
    const smoke = stage.querySelector('.burnout-smoke');
    const mark = stage.querySelector('.pneu-mark');
    const motoData = MOTOS[motoIndex];

    if (motoImgElement.classList.contains('animate-drive')) return;

    // Fumaça e Marca
    smoke.style.opacity = "1";
    mark.style.width = "120px";
    mark.style.transition = "width 0.4s";

    // Inicia Corrida
    setTimeout(() => { 
        motoImgElement.classList.add('animate-drive'); 
        smoke.style.opacity = "0"; 
    }, 500);

    // TROCA A COR quando estiver fora da tela
    setTimeout(() => {
        if(motoData.imgs.length > 1) {
            let currentIdx = parseInt(stage.getAttribute('data-current-img'));
            let nextIdx = (currentIdx + 1) % motoData.imgs.length;
            
            motoImgElement.src = motoData.imgs[nextIdx];
            stage.setAttribute('data-current-img', nextIdx);
        }
    }, 1300);

    // Reset da animação
    setTimeout(() => { 
        motoImgElement.classList.remove('animate-drive'); 
        mark.style.width = "0"; 
    }, 2800);
}

/* =========================================
   3. MÓDULO DE CORES DAS PARTÍCULAS (ALTERE AQUI)
   ========================================= */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
const techColors = ['#e60000', '#ffcc00', '#ffaa00', '#ffffff']; // Cores do novo tema

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

class TechParticle {
    constructor() { this.reset(true); }
    
    reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.vx = (Math.random() - 0.5) * 1; 
        this.vy = -(Math.random() * 1.5 + 0.5); // Sobem lentamente
        this.size = Math.random() * 4 + 1;
        this.color = techColors[Math.floor(Math.random() * techColors.length)];
        this.alpha = Math.random() * 0.5 + 0.3;
    }

    update() {
        this.y += this.vy;
        this.x += this.vx;

        if (this.y < -10) this.reset();
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

for(let i=0; i<80; i++) particles.push(new TechParticle()); 

function animateBG() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateBG);
}

renderCards();
animateBG();
