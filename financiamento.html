<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Financiamento - Honda Revemar</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --honda-red: #cc0000;
            --honda-dark-red: #990000;
            --honda-hover-red: #e60000;
            --bg-main: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --focus-ring: rgba(204, 0, 0, 0.2);
            --wa-green: #25d366;
            --wa-dark-green: #128c7e;
            --shadow-light: 0 10px 30px rgba(0, 0, 0, 0.06);
            --shadow-card: 0 15px 35px rgba(204, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 10% 10%, rgba(204, 0, 0, 0.03) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(37, 211, 102, 0.03) 0px, transparent 50%);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 12px 40px 12px;
        }

        .header-bar {
            width: 100%;
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
            border-bottom: 4px solid var(--honda-red);
            padding: 12px 0;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .header-content {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-badge i {
            color: var(--honda-red);
            font-size: 13px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* LOGO */
        .logo-container {
            text-align: center;
            padding: 10px 0;
        }

        .logo-cpf {
            display: inline-block;
            max-width: 220px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .logo-cpf:hover {
            transform: scale(1.03);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--honda-red) 0%, var(--honda-dark-red) 100%);
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            color: var(--honda-red);
            text-align: center;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: -0.2px;
        }

        .card-title i {
            font-size: 22px;
        }

        /* BIKE SELECTOR CONTAINER */
        .selector-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }

        .selector-box label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .bike-select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .bike-select:focus {
            border-color: var(--honda-red);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .carousel-wrapper {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .carousel {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
        }

        .carousel-track {
            display: flex;
            width: max-content;
            animation: scroll 22s linear infinite;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .carousel-item {
            position: relative;
            height: 250px;
            width: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            cursor: pointer;
        }

        .carousel-track img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
        }

        .carousel-item:hover img {
            transform: scale(1.06);
        }

        .zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .moto-badge {
            background: linear-gradient(135deg, var(--honda-red) 0%, var(--honda-dark-red) 100%);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 14px;
            text-align: center;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(204, 0, 0, 0.25);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 700;
            color: #334155;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.1px;
        }

        .form-group label i {
            color: var(--honda-red);
            font-size: 15px;
            width: 16px;
            text-align: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: #fafafa;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            background-color: #ffffff;
            border-color: var(--honda-red);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        /* VALIDATION STYLES */
        .error-message {
            color: #dc2626;
            font-size: 12px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
        }

        input.invalid {
            border-color: #dc2626 !important;
            background-color: #fef2f2 !important;
        }

        input.valid {
            border-color: #16a34a !important;
        }

        .btn-submit {
            width: 100%;
            padding: 16px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--wa-green) 0%, var(--wa-dark-green) 100%);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.45);
            background: linear-gradient(135deg, #28e16f 0%, #107c6f 100%);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .btn-submit i {
            font-size: 24px;
        }

        /* TRUST BADGES */
        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
        }

        .trust-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .trust-item i {
            font-size: 18px;
            color: var(--honda-red);
        }

        .trust-item span {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* ZOOM MODAL */
        #zoomView {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            cursor: zoom-out;
        }

        #zoomImg {
            max-width: 92%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            background: #ffffff;
            padding: 10px;
        }

        .close-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 28px;
            background: rgba(255,255,255,0.15);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-zoom:hover {
            background: rgba(255,255,255,0.3);
        }

        /* RESPONSIVENESS */
        @media (max-width: 480px) {
            body {
                padding: 0 8px 30px 8px;
            }
            .card {
                padding: 18px 14px;
                border-radius: 16px;
            }
            .card-title {
                font-size: 18px;
            }
            .carousel {
                height: 200px;
            }
            .carousel-item {
                height: 200px;
                width: 260px;
            }
            .btn-submit {
                font-size: 15px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="header-content">
            <div class="header-badge">
                <i class="fa-solid fa-shield-halved"></i> Concessionária Autorizada
            </div>
            <div class="header-badge" style="background: rgba(204,0,0,0.2); border-color: var(--honda-red);">
                <i class="fa-solid fa-award"></i> Grupo Revemar Honda
            </div>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- LOGO REVEMAR -->
        <div class="logo-container">
            <img src="https://www.image2url.com/r2/default/images/1790188842741-17571ec1-da38-42fa-9f65-51c1f0db61a2.png" alt="Revemar Honda" class="logo-cpf">
        </div>

        <!-- CARD SELEÇÃO & GALERIA DA MOTO -->
        <div class="card">
            <h1 class="card-title" id="tituloMoto">
                <i class="fa-solid fa-motorcycle"></i> Carregando...
            </h1>

            <!-- SELECTOR DE MOTOS PARA NAVEGAÇÃO FÁCIL -->
            <div class="selector-box">
                <label for="selectMotoQuick"><i class="fa-solid fa-sliders"></i> Alterar modelo para simulação:</label>
                <select id="selectMotoQuick" class="bike-select">
                    <!-- Opções inseridas via JavaScript -->
                </select>
            </div>

            <div class="carousel-wrapper">
                <div class="carousel">
                    <div class="carousel-track" id="carouselTrack"></div>
                </div>
                <div class="zoom-hint">
                    <i class="fa-solid fa-magnifying-glass-plus"></i> Clique na foto para ampliar
                </div>
            </div>
        </div>

        <!-- CARD FORMULÁRIO DE SIMULAÇÃO -->
        <div class="card">
            <h2 class="card-title">
                <i class="fa-solid fa-calculator"></i> Simulação de Financiamento
            </h2>

            <div class="moto-badge">
                <i class="fa-solid fa-circle-check"></i>
                <span id="motoEscolhida">Carregando Modelo...</span>
            </div>

            <form id="finForm" class="form-grid">
                <!-- NOME -->
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Nome Completo *</label>
                    <input name="nome" required placeholder="Ex: João da Silva Santos" autocomplete="name">
                </div>

                <!-- CPF -->
                <div class="form-group">
                    <label><i class="fa-solid fa-address-card"></i> CPF (Análise de Crédito) *</label>
                    <input name="cpf" id="cpfInput" required placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
                    <div class="error-message" id="cpfErro">
                        <i class="fa-solid fa-triangle-exclamation"></i> CPF inválido. Por favor, verifique os dígitos.
                    </div>
                </div>

                <!-- DATA DE NASCIMENTO -->
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-day"></i> Data de Nascimento *</label>
                    <input name="nascimento" id="nascimentoInput" type="text" required placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric">
                </div>

                <!-- CELULAR / WHATSAPP -->
                <div class="form-group">
                    <label><i class="fa-brands fa-whatsapp"></i> Celular / WhatsApp *</label>
                    <input name="whatsapp" required placeholder="(99) 99999-9999" type="tel" inputmode="tel">
                </div>

                <!-- PROFISSÃO -->
                <div class="form-group">
                    <label><i class="fa-solid fa-user-gear"></i> Ocupação / Profissão *</label>
                    <select name="tipo" required>
                        <option value="" disabled selected>Selecione seu tipo de ocupação...</option>
                        <option value="Autônomo">Autônomo / Profissional Liberal</option>
                        <option value="Assalariado">Assalariado / Carteira Assinada</option>
                        <option value="Servidor Público">Servidor Público / Concursado</option>
                        <option value="Empresário / MEI">Empresário / MEI</option>
                        <option value="Aposentado / Pensionista">Aposentado / Pensionista</option>
                    </select>
                </div>

                <!-- RENDA MENSAL -->
                <div class="form-group">
                    <label><i class="fa-solid fa-money-bill-wave"></i> Renda Mensal (R$) *</label>
                    <input name="renda" id="rendaInput" type="text" required placeholder="Ex: 2.500" inputmode="numeric">
                </div>

                <!-- HABILITAÇÃO -->
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card-clip"></i> Possui CNH (Habilitação)? *</label>
                    <select name="habilitacao" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Sim">Sim, possuo CNH (Categoria AB)</option>
                      
                        <option value="Não">Não possuo CNH no momento</option>
                    </select>
                </div>

                <!-- ENTRADA -->
                <div class="form-group">
                    <label><i class="fa-solid fa-hand-holding-dollar"></i> Valor de Entrada Pretendido (R$)</label>
                    <input name="entrada" id="entradaInput" type="text" placeholder="Ex: 1.500" inputmode="numeric">
                </div>

                <input type="hidden" name="moto" id="motoInput">

                <!-- BOTÃO DE SUBMISSÃO -->
                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Enviar Pré-Análise no WhatsApp</span>
                </button>
            </form>

            <!-- TRUST SEALS -->
            <div class="trust-grid">
                <div class="trust-item">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Resposta Rápida</span>
                </div>
                <div class="trust-item">
                    <i class="fa-solid fa-lock"></i>
                    <span>Dados Seguros</span>
                </div>
                <div class="trust-item">
                    <i class="fa-solid fa-certificate"></i>
                    <span>Garantia Honda</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ZOOM DA IMAGEM -->
    <div id="zoomView" onclick="fecharZoom()">
        <div class="close-zoom"><i class="fa-solid fa-xmark"></i></div>
        <img id="zoomImg" alt="Visualização em alta resolução da motocicleta Honda">
    </div>

            { id:'NX500', nome:'NX 500', img1:'https://www.honda.com.br/motos/sites/hda/files/2025-05/3_4FD_2.webp', img2:'https://www.honda.com.br/motos/sites/hda/files/2025-05/Farol_0.webp', img3:'https://www.honda.com.br/motos/sites/hda/files/2025-05/Painel_1.webp' },
            { id:'NC750X', nome:'NC 750X', img1:'https://www.honda.com.br/motos/sites/hda/files/2025-10/3_4FD-v.webp', img2:'https://www.honda.com.br/motos/sites/hda/files/2025-10/2025-NC750X_Location_Details_0167_L.webp', img3:'https://www.honda.com.br/motos/sites/hda/files/2025-10/3_4TD-v.webp' },
            { id:'CB1000R70', nome:'CB 1000R 70%', img1:'https://www.honda.com.br/motos/sites/hda/files/2026-08/2025-CB1000HORNET_SP_Location_Accy_Sport_Pack_Detail_0065_L_Design%20-%20Vers%C3%A3o%20SP.webp', img2:'https://www.honda.com.br/motos/sites/hda/files/2026-08/2025-CB1000HORNET_studio_MAT_BALLISTIC_BLACK_METALLIC_SP_Close-Up_Around_Meter_L_Tecnologia%20-%20Vers%C3%A3o%20SP.webp', img3:'https://www.honda.com.br/motos/sites/hda/files/2026-08/2025-CB1000HORNET_SP_Location_Static_0057_L_Design%20-%20Vers%C3%A3o%20SP.webp' },
            { id:'CRF1100L', nome:'CRF 1100L AFRICA TWIN 70%', img1:'https://www.honda.com.br/motos/sites/hda/files/2025-12/Led-e-guid%C3%A3o-moto-Honda-Africa-Twin-em-destaque.webp', img2:'https://www.honda.com.br/motos/sites/hda/files/2025-12/Roda-moto-Honda-Africa-Twin.webp', img3:'https://www.honda.com.br/motos/sites/hda/files/2025-12/Painel-moto-Honda.webp' }
        ];

        const params = new URLSearchParams(window.location.search);
        const motoIdUrl = params.get("moto");

        // Elementos DOM
        const tituloMoto = document.getElementById("tituloMoto");
        const motoEscolhida = document.getElementById("motoEscolhida");
        const motoInput = document.getElementById("motoInput");
        const selectQuick = document.getElementById("selectMotoQuick");
        const track = document.getElementById("carouselTrack");

        // Popular Dropdown Quick Select
        motos.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m.id;
            opt.textContent = m.nome;
            selectQuick.appendChild(opt);
        });

        // Identificar moto inicial
        let motoAtual = motos.find(m => m.id === motoIdUrl) || motos[0];

        function carregarMoto(moto) {
            motoAtual = moto;
            selectQuick.value = moto.id;
            tituloMoto.innerHTML = `<i class="fa-solid fa-motorcycle"></i> ${moto.nome}`;
            motoEscolhida.innerText = moto.nome;
            motoInput.value = moto.nome;

            const imagens = [moto.img1, moto.img2, moto.img3];
            // Multiplicamos a lista para efeito de loop continuo
            const imagensLoop = [...imagens, ...imagens, ...imagens];

            track.innerHTML = imagensLoop.map((src, index) => `
                <div class="carousel-item" onclick="abrirZoom('${src}')">
                    <img src="${src}" alt="${moto.nome} - Imagem ${index + 1}" loading="lazy" onerror="this.src='https://placehold.co/400x300/f0f2f5/cc0000?text=Honda+Revemar'">
                </div>
            `).join("");
        }

        // Listener para troca rápida de moto
        selectQuick.addEventListener("change", function() {
            const motoEncontrada = motos.find(m => m.id === this.value);
            if (motoEncontrada) {
                carregarMoto(motoEncontrada);
            }
        });

        // Inicialização
        carregarMoto(motoAtual);

        function abrirZoom(src) {
            const zoomView = document.getElementById("zoomView");
            const zoomImg = document.getElementById("zoomImg");
            zoomImg.src = src;
            zoomView.style.display = "flex";
        }

        function fecharZoom() {
            document.getElementById("zoomView").style.display = "none";
        }

        // MÁSCARA DE DATA DE NASCIMENTO
        const nascimentoInput = document.getElementById("nascimentoInput");
        nascimentoInput.addEventListener("input", function(e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 2) v = v.replace(/^(\d{2})(\d)/, "$1/$2");
            if (v.length > 5) v = v.replace(/^(\d{2})\/(\d{2})(\d)/, "$1/$2/$3");
            e.target.value = v;
        });

        // MÁSCARA E VALIDAÇÃO DE CPF EM TEMPO REAL
        const cpfInput = document.getElementById("cpfInput");
        const cpfErro = document.getElementById("cpfErro");

        cpfInput.addEventListener("input", function(e) {
            let v = e.target.value.replace(/\D/g, "");

            if (v.length > 3) v = v.replace(/(\d{3})(\d)/, "$1.$2");
            if (v.length > 7) v = v.replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
            if (v.length > 11) v = v.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4");

            e.target.value = v;

            const cpfLimpo = v.replace(/\D/g, "");

            if (cpfLimpo.length === 11) {
                if (!validarCPF(cpfLimpo)) {
                    cpfErro.style.display = "flex";
                    cpfInput.classList.add("invalid");
                    cpfInput.classList.remove("valid");
                } else {
                    cpfErro.style.display = "none";
                    cpfInput.classList.remove("invalid");
                    cpfInput.classList.add("valid");
                }
            } else {
                cpfErro.style.display = "none";
                cpfInput.classList.remove("invalid", "valid");
            }
        });

        // FUNÇÃO ALGORÍTMICA DE VALIDAÇÃO DE CPF
        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

            let soma = 0;
            let resto;

            for (let i = 1; i <= 9; i++) {
                soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            }

            resto = (soma * 10) % 11;
            if (resto >= 10) resto = 0;
            if (resto !== parseInt(cpf.substring(9, 10))) return false;

            soma = 0;
            for (let i = 1; i <= 10; i++) {
                soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            }

            resto = (soma * 10) % 11;
            if (resto >= 10) resto = 0;
            if (resto !== parseInt(cpf.substring(10, 11))) return false;

            return true;
        }

        // FORMATAÇÃO AUTOMÁTICA EM REAIS (PT-BR)
        function formatarMoeda(input) {
            input.addEventListener("input", function() {
                let valor = input.value.replace(/\D/g, "");
                if (valor === "") {
                    input.value = "";
                    return;
                }
                valor = parseInt(valor, 10).toLocaleString("pt-BR");
                input.value = valor;
            });
        }

        const renda = document.getElementById("rendaInput");
        const entrada = document.getElementById("entradaInput");
        if (renda) formatarMoeda(renda);
        if (entrada) formatarMoeda(entrada);

        document.getElementById("finForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const cpfLimpo = cpfInput.value.replace(/\D/g, "");
            if (cpfLimpo.length === 11 && !validarCPF(cpfLimpo)) {
                cpfErro.style.display = "flex";
                cpfInput.focus();
                return;
            }

            const fd = new FormData(this);
            const data = Object.fromEntries(fd.entries());

            const msg = `*INFORMAÇÕES NECESSÁRIAS PARA PRÉ-ANÁLISE*
*Moto:* ${data.moto}
*Nome:* ${data.nome}
*CPF:* ${data.cpf}
*Nascimento:* ${data.nascimento}
*Celular:* ${data.whatsapp}
*Renda:* R$ ${data.renda}
*Tipo:* ${data.tipo}
*Habilitação:* ${data.habilitacao}
*Entrada:* R$ ${data.entrada || "0"}`;

            const numeroWhatsApp = "5594992781498";
            window.location.href = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(msg)}`;
        });
    </script>
