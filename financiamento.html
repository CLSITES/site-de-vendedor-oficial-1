<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FÁCIL DE APROVAR - Revemar</title>


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --verde: #009C3B;
    --verde-escuro: #006B2A;
    --amarelo: #00205f;
    --azul: #002b15;
    --azul-claro: #3E8EDE;
    --branco: #ffffff;
}

/* FUNDO */
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, var(--verde) 0%, var(--azul) 1%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
}

 /* --- CONTAINER PRINCIPAL (LIMITADOR PC) --- */
    .main-wrapper {
        width: 100%;
        max-width: 600px; /* Largura ideal para desktop */
        position: relative;
        z-index: 1;
    }
  /* --- LOGO RECOMPENSIVA --- */
    .logo-cpf {
        display: block;
        margin: 0 auto 20px auto;
        width: clamp(200px, 30vw, 150px);
        filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
        animation: pulseLogo 5s infinite alternate;
    }

/* CARDS */
.card {
    background: var(--branco);
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
    position: relative;
}

/* LINHA TOPO COLORIDA */
.card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, var(--verde), var(--amarelo), var(--azul));
    border-radius: 20px 20px 0 0;
}

/* TITULOS */
h2 {
    text-align: center;
    font-weight: 800;
    background: linear-gradient(45deg, var(--verde), var(--azul));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* NOME DA MOTO */
.moto-name {
    background: linear-gradient(90deg, var(--verde), var(--amarelo));
    color: #000;
    padding: 12px;
    border-radius: 30px;
    text-align: center;
    font-weight: 800;
}

/* INPUTS */
input, select {
    width: 95%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #ddd;
    margin-top: 5px;
}

/* BOTÃO */
button {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(45deg, var(--verde), var(--amarelo));
    font-weight: 800;
    cursor: pointer;
}
/* --- CARROSSEL --- */
    .carousel {
        width: 100%;
        height: clamp(180px, 40vh, 260px);
        overflow: hidden;
        border-radius: 16px;
        margin-bottom: 10px;
        background: white;
    }

    .carousel-track {
        display: flex;
        width: max-content;
        animation: scroll 18s linear infinite;
    }

    .carousel-track img {
        height: clamp(180px, 40vh, 260px);
        width: auto;
        min-width: 280px;
        object-fit: contain;
        padding: 10px;
        transition: 0.3s;
    }

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
</style>
</head>
<body>

<div class="main-wrapper">
    <img src="https://www.image2url.com/r2/default/images/1780318605532-0c5e2b58-86c8-401e-b9b4-eb590e2bca65.png" alt="Logo" class="logo-cpf">

    <div class="card">
        <h2 id="tituloMoto">Carregando...</h2>
        <div class="carousel">
            <div class="carousel-track" id="carouselTrack"></div>
        </div>
    </div>

    <div class="card">
        <h2>✅ Simulação de Financiamento</h2>
        <p class="moto-name" id="motoEscolhida">Carregando...</p>

        <form id="finForm">
            <label>Nome completo *</label>
            <input name="nome" required placeholder="Ex: João da Silva">

            <label>CPF *</label>
<input name="cpf" id="cpfInput" required placeholder="000.000.000-00" maxlength="14">
<small id="cpfErro" style="color:red; display:none;">CPF inválido</small>

            <label>Data de Nascimento *</label>
            <input name="nascimento" id="nascimentoInput" type="text" required placeholder="DD/MM/AAAA" maxlength="10">

            <label>Celular *</label>
            <input name="whatsapp" required placeholder="(99) 99999-9999">

            <label>Profissão *</label>
            <select name="tipo" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="Autônomo">Autônomo</option>
                <option value="Assalariado">Assalariado</option>
            </select>

            <label>Renda Mensal (R$) *</label>
            <input name="renda" id="rendaInput" type="text" required placeholder="Ex: 2.000">

            <label>Possui habilitação? *</label>
            <select name="habilitacao" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>

            <label>Valor da entrada (R$)</label>
            <input name="entrada" id="entradaInput" type="text" placeholder="Ex: 1.500">

            <input type="hidden" name="moto" id="motoInput">
            <button type="submit">📲 Enviar para WhatsApp</button>
        </form>
    </div>
</div>

    const fd = new FormData(this);
    const data = Object.fromEntries(fd.entries());
    const msg = `*INFORMAÇÕES NECESSÁRIAS PARA PRÉ-ANÁLISE*
*Moto:* ${data.moto}
*Nome:* ${data.nome}
*CPF:* ${data.cpf}
*Nascimento:* ${data.nascimento}
*Celular:* ${data.whatsapp}
*Renda:* R$ ${data.renda}
*Tipo:* ${data.tipo}
*Habilitação:* ${data.habilitacao}
*Entrada:* R$ ${data.entrada || "0"}`;

// FORMATA DATA
const nascimentoInput = document.getElementById("nascimentoInput");

nascimentoInput.addEventListener("input", function(e) {
    let v = e.target.value.replace(/\D/g, "");

    if (v.length > 2) v = v.replace(/^(\d{2})(\d)/, "$1/$2");
    if (v.length > 5) v = v.replace(/^(\d{2})\/(\d{2})(\d)/, "$1/$2/$3");

    e.target.value = v;
});

// CPF
const cpfInput = document.getElementById("cpfInput");
const cpfErro = document.getElementById("cpfErro");

cpfInput.addEventListener("input", function(e){
    let v = e.target.value.replace(/\D/g,"");

    if(v.length > 3) v = v.replace(/(\d{3})(\d)/,"$1.$2");
    if(v.length > 7) v = v.replace(/(\d{3})\.(\d{3})(\d)/,"$1.$2.$3");
    if(v.length > 11) v = v.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,"$1.$2.$3-$4");

    e.target.value = v;

    // VALIDAÇÃO EM TEMPO REAL
    const cpfLimpo = v.replace(/\D/g, "");

    if (cpfLimpo.length === 11) {
        if (!validarCPF(cpfLimpo)) {
            cpfErro.style.display = "block";
            cpfInput.style.borderColor = "red";
        } else {
            cpfErro.style.display = "none";
            cpfInput.style.borderColor = "green";
        }
    } else {
        cpfErro.style.display = "none";
        cpfInput.style.borderColor = "#e0e6ed";
    }
});

// VALIDA CPF
function validarCPF(cpf) {
    cpf = cpf.replace(/\D/g,'');

    if (cpf.length != 11 || /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0, resto;

    for (let i = 1; i <= 9; i++)
        soma += parseInt(cpf.substring(i-1, i)) * (11 - i);

    resto = (soma * 10) % 11;
    if (resto >= 10) resto = 0;
    if (resto != parseInt(cpf.substring(9, 10))) return false;

    soma = 0;
    for (let i = 1; i <= 10; i++)
        soma += parseInt(cpf.substring(i-1, i)) * (12 - i);

    resto = (soma * 10) % 11;
    if (resto >= 10) resto = 0;
    if (resto != parseInt(cpf.substring(10, 11))) return false;

    return true;
}

// FORMATAÇÃO AUTOMÁTICA (R$)
document.addEventListener("DOMContentLoaded", function () {

    function formatar(input) {
        input.addEventListener("input", function () {
            let valor = input.value.replace(/\D/g, "");

            if (valor === "") {
                input.value = "";
                return;
            }

            // CONVERTE PRA NÚMERO E FORMATA
            valor = parseInt(valor).toLocaleString("pt-BR");

            input.value = valor;
        });
    }

    const renda = document.getElementById("rendaInput");
    const entrada = document.getElementById("entradaInput");

    if (renda) formatar(renda);
    if (entrada) formatar(entrada);

});
</script>
