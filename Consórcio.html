<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consórcio Honda - Revemar</title>

<!-- FONTE MONTSERRAT & ÍCONES FONTAWESOME -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --vermelho-honda: #cc0000;
    --vermelho-dark: #990000;
    --verde-wpp: #25D366;
    --verde-wpp-dark: #128C7E;
    --cinza-bg: #f4f6f9;
    --cinza-texto: #2d3748;
    --cinza-borda: #cbd5e1;
    --branco: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--cinza-bg);
    color: var(--cinza-texto);
    min-height: 100vh;
    padding: 20px 15px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
}

/* BANNER DE TOPO DA HONDA */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, var(--vermelho-honda) 0%, var(--vermelho-dark) 100%);
    z-index: 0;
}

/* CONTAINER PRINCIPAL */
.main-wrapper {
    width: 100%;
    max-width: 580px;
    position: relative;
    z-index: 1;
}

/* HEADER & LOGO */
.header-brand {
    text-align: center;
    margin-bottom: 20px;
}

.logo-top {
    display: block;
    margin: 0 auto 10px auto;
    width: clamp(140px, 35vw, 190px);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
}

.badge-oficial {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    color: var(--branco);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.3);
}

/* CARDS */
.card {
    background: var(--branco);
    padding: 25px 22px;
    border-radius: 20px;
    margin-bottom: 22px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    border-top: 5px solid var(--vermelho-honda);
}

/* TÍTULOS */
h2 {
    text-align: center;
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--vermelho-honda);
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: -0.3px;
}

/* BADGE NOME DA MOTO */
.moto-name {
    background: linear-gradient(135deg, var(--vermelho-honda), var(--vermelho-dark));
    color: var(--branco);
    padding: 12px 20px;
    border-radius: 30px;
    text-align: center;
    font-weight: 800;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(204, 0, 0, 0.25);
    margin-bottom: 22px;
    text-transform: uppercase;
}

/* FORMULÁRIO & CAMPOS */
.form-group {
    margin-bottom: 16px;
}

label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.88rem;
    color: #4a5568;
    margin-bottom: 6px;
}

label i {
    color: var(--vermelho-honda);
    font-size: 0.95rem;
}

input, select {
    width: 100%;
    padding: 13px 15px;
    border-radius: 12px;
    border: 2px solid var(--cinza-borda);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.25s ease;
    background-color: #f8fafc;
    color: #1a202c;
}

select.select-destaque {
    background-color: #fff5f5;
    border-color: var(--vermelho-honda);
    font-weight: 800;
    color: var(--vermelho-honda);
    text-align: center;
    text-align-last: center;
}

input:focus, select:focus {
    border-color: var(--vermelho-honda);
    background-color: var(--branco);
    box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.12);
}

small#cpfErro {
    color: #e53e3e;
    font-weight: 700;
    font-size: 0.8rem;
    margin-top: 5px;
    display: none;
}

/* BOTÃO DE SUBMIT (WHATSAPP) */
button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--verde-wpp) 0%, var(--verde-wpp-dark) 100%);
    color: var(--branco);
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    text-transform: uppercase;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(37, 211, 102, 0.45);
}

button i {
    font-size: 1.3rem;
}

/* SELO DE SEGURANÇA */
.security-badge {
    text-align: center;
    font-size: 0.78rem;
    color: #718096;
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 600;
}

.security-badge i {
    color: var(--verde-wpp-dark);
}

/* CARROSSEL */
.carousel {
    width: 100%;
    height: clamp(180px, 40vh, 250px);
    overflow: hidden;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px solid #edf2f7;
}

.carousel-track {
    display: flex;
    width: max-content;
    animation: scroll 18s linear infinite;
}

.carousel-track img {
    height: clamp(180px, 40vh, 250px);
    width: auto;
    min-width: 260px;
    object-fit: contain;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.2s;
}

.carousel-track img:hover {
    transform: scale(1.03);
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* ZOOM VIEW MODAL */
#zoomView {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
}

#zoomImg {
    max-width: 90%;
    max-height: 85%;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
</style>

<body>

<div class="main-wrapper">
    <!-- LOGO E BADGE -->
    <div class="header-brand">
        <img src="https://www.image2url.com/r2/default/images/1790188842741-17571ec1-da38-42fa-9f65-51c1f0db61a2.png" alt="Logo Revemar Honda" class="logo-top">
        <span class="badge-oficial"><i class="fas fa-shield-alt"></i> Concessionária Autorizada Honda</span>
    </div>

    <!-- CARD DO MODELO / FOTOS (SELETOR DE MOTO MOVIDO PARA CÁ) -->
    <div class="card">
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="justify-content: center; color: var(--vermelho-honda); font-size: 0.9rem; text-transform: uppercase; font-weight: 800;">
                <i class="fas fa-motorcycle"></i> Selecione o Modelo da Moto:
            </label>
            <select id="motoSelect" class="select-destaque">
                <!-- Opções geradas via JS -->
            </select>
        </div>

        <div class="carousel">
            <div class="carousel-track" id="carouselTrack"></div>
        </div>
    </div>

    <!-- CARD DO FORMULÁRIO DE CONSÓRCIO -->
    <div class="card">
        <h2><i class="fas fa-calculator"></i> Simulação de Consórcio</h2>
        <p class="moto-name" id="motoEscolhida">Carregando...</p>

        <form id="consForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nome completo *</label>
                <input name="nome" placeholder="Ex: João da Silva" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-id-card"></i> CPF *</label>
                <input name="cpf" id="cpfInput" placeholder="000.000.000-00" maxlength="14" required>
                <small id="cpfErro">CPF inválido. Por favor, verifique.</small>
            </div>

            <div class="form-group">
                <label><i class="fas fa-clock"></i> Tem pressa para contemplar? *</label>
                <select name="pressa" id="pressaSelect" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="sim">Sim, tenho pressa</option>
                    <option value="nao">Não, posso aguardar</option>
                </select>
            </div>

            <div class="form-group" id="parcelaIdealBox" style="display:none;">
                <label><i class="fas fa-hand-holding-usd"></i> Qual valor de parcela seria ideal por mês? *</label>
                <input type="text" name="parcelaIdeal" id="parcelaIdealInput" placeholder="Ex: 500">
            </div>

            <div class="form-group" id="planoBox">
                <label><i class="fas fa-list-ol"></i> Plano de parcelas *</label>
                <select name="plano" id="planoSelect" required></select>
            </div>

            <input type="hidden" name="moto" id="motoInput">
            <button type="submit"><i class="fab fa-whatsapp"></i> Enviar para WhatsApp</button>
            
            <div class="security-badge">
                <i class="fas fa-lock"></i> Seus dados estão seguros | Atendimento Oficial Revemar
            </div>
        </form>
    </div>
</div>

<!-- MODAL ZOOM IMAGEM -->
<div id="zoomView" onclick="this.style.display='none'">
    <img id="zoomImg" alt="Ampliação do Modelo">
</div>

// FUNÇÃO PARA ATUALIZAR MOTO SELECIONADA
function selecionarMoto(motoObj) {
    if(!motoObj) return;

    motoEscolhida.innerText = motoObj.nome;
    motoInput.value = motoObj.nome;
    motoSelect.value = motoObj.id;

    // MONTA O CARROSSEL (Garante rotação contínua)
    const listaImgs = motoObj.imgs.length < 3 ? [...motoObj.imgs, ...motoObj.imgs, ...motoObj.imgs, ...motoObj.imgs] : [...motoObj.imgs, ...motoObj.imgs];
    track.innerHTML = listaImgs.map(src => `<img src="${src}" alt="${motoObj.nome}" onclick="abrirZoom('${src}')">`).join('');

    // REPOPULA AS PARCELAS DO CONSÓRCIO
    planoSelect.innerHTML = '';
    Object.entries(motoObj.parcelas).forEach(([p, v]) => {
        if(v > 0) {
            const opt = document.createElement('option');
            opt.value = `${p}|${v.toFixed(2)}`;
            opt.textContent = `${p}x de R$ ${v.toFixed(2)}`;
            planoSelect.appendChild(opt);
        }
    });
}

const cpfInput = document.getElementById("cpfInput");
const cpfErro = document.getElementById("cpfErro");

cpfInput.addEventListener("input", function(e){
    let v = e.target.value.replace(/\D/g,"");

    if(v.length > 3) v = v.replace(/(\d{3})(\d)/,"$1.$2");
    if(v.length > 7) v = v.replace(/(\d{3})\.(\d{3})(\d)/,"$1.$2.$3");
    if(v.length > 11) v = v.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,"$1.$2.$3-$4");

    e.target.value = v;

    const cpfLimpo = v.replace(/\D/g, "");

    if (cpfLimpo.length === 11) {
        if (!validarCPF(cpfLimpo)) {
            cpfErro.style.display = "block";
            cpfInput.style.borderColor = "#e53e3e";
        } else {
            cpfErro.style.display = "none";
            cpfInput.style.borderColor = "#38a169";
        }
    } else {
        cpfErro.style.display = "none";
        cpfInput.style.borderColor = "#cbd5e1";
    }
});

function validarCPF(cpf) {
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0, resto;

    for (let i = 1; i <= 9; i++)
        soma += parseInt(cpf.substring(i-1, i)) * (11 - i);

    resto = (soma * 10) % 11;
    if (resto >= 10) resto = 0;
    if (resto !== parseInt(cpf.substring(9, 10))) return false;

    soma = 0;
    for (let i = 1; i <= 10; i++)
        soma += parseInt(cpf.substring(i-1, i)) * (12 - i);

    resto = (soma * 10) % 11;
    if (resto >= 10) resto = 0;
    if (resto !== parseInt(cpf.substring(10, 11))) return false;

    return true;
}
