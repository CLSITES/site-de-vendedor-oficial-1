<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consórcio CPF Aprovado - Revemar Honda</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary-bg: #00102a;
  --card-bg: rgba(255, 255, 255, 0.98);
  --honda-blue: #0044cc;
  --honda-dark-blue: #002266;
  --gold-accent: #ffcc00;
  --text-dark: #001a33;
  --input-bg: #f0f4f8;
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.3);
}

body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #00102a 0%, #0044cc 100%);
  background-attachment: fixed;
  padding: 20px;
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center; /* Centraliza no PC */
}

/* Logo adaptável */
.logo-top {
  width: 150px;
  margin-bottom: 20px;
  filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
  animation: pulseLogo 3s infinite alternate;
}

/* CONTAINER PRINCIPAL (Limitador de largura para PC) */
.main-container {
  width: 100%;
  max-width: 600px; /* Largura ideal para leitura no PC */
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  background: var(--card-bg);
  padding: 30px;
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
  transition: transform 0.3s ease;
}

/* Feedback visual no PC */
@media (min-width: 768px) {
  .card:hover { transform: translateY(-5px); }
}

.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--gold-accent), var(--honda-blue), var(--gold-accent));
}

h2 {
  margin: 10px 0 20px;
  color: var(--honda-dark-blue);
  text-transform: uppercase;
  font-weight: 800;
  font-size: clamp(1.2rem, 5vw, 1.5rem); /* Fonte fluida */
  text-align: center;
}

.moto-name {
  text-align: center;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(90deg, var(--honda-dark-blue), var(--honda-blue));
  padding: 12px 25px;
  border-radius: 50px;
  margin: 0 auto 25px auto;
  display: table;
  text-transform: uppercase;
}

form { display: grid; gap: 12px; }

label {
  font-weight: 700;
  color: var(--honda-dark-blue);
  font-size: 0.8rem;
  text-transform: uppercase;
}

input, select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #e0e6ed;
  background-color: var(--input-bg);
  font-size: 16px;
  font-family: 'Montserrat', sans-serif;
  box-sizing: border-box;
}

input:focus { border-color: var(--honda-blue); outline: none; background: #fff; }

button {
  width: 100%;
  padding: 18px;
  background: linear-gradient(45deg, #128c7e, #25d366);
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
  text-transform: uppercase;
  margin-top: 15px;
  box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
}

/* CAROUSEL ADAPTÁVEL */
.carousel {
  width: 100%;
  height: clamp(180px, 40vh, 260px);
  overflow: hidden;
  border-radius: 16px;
  background: #fff;
}

.carousel-track {
  display: flex;
  width: max-content;
  animation: scrollInfinite 20s linear infinite;
}

.carousel-track img {
  width: clamp(280px, 80vw, 450px);
  height: 100%;
  object-fit: contain;
  padding: 15px;
}

@keyframes scrollInfinite {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@keyframes pulseLogo {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}

/* Ajustes específicos para Celular */
@media (max-width: 480px) {
  body { padding: 15px; }
  .card { padding: 20px; }
  .logo-top { width: 110px; }
}
</style>
</head>

<body>

<img src="https://image2url.com/r2/default/images/1772572693263-8f07cbb3-a571-44e4-8412-081a82ed80d9.blob" alt="Logo CPF Aprovado" class="logo-top">

<div class="main-container">
  <div class="card">
    <h2 id="tituloMoto">Carregando...</h2>
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
  </div>

  <div class="card">
    <h2>✅ Simulação de Consórcio</h2>
    <p class="moto-name" id="motoEscolhida"></p>

    <form id="consForm">
      <label>Nome completo *</label>
      <input name="nome" placeholder="Seu nome" required>

      <label>CPF *</label>
      <input name="cpf" id="cpfInput" placeholder="000.000.000-00" required>

      <label>Plano de parcelas *</label>
      <select name="plano" id="planoSelect" required></select>

      <label>Tem pressa para contemplar? *</label>
      <select name="pressa" required>
        <option value="">Selecione...</option>
        <option>Sim, tenho pressa (Lance)</option>
        <option>Não, posso aguardar (Sorteio)</option>
      </select>

      <label>Parcela ideal (R$) *</label>
      <input type="number" name="parcelaIdeal" placeholder="Ex: 450" required>

      <input type="hidden" name="moto" id="motoInput">
      <button type="submit">📲 Consultar no WhatsApp</button>
    </form>
  </div>
</div>

<script>
// (O restante do script permanece o mesmo do anterior para manter a lógica das motos)
const motos = [
  { id:'BIZ125ES', nome:'BIZ 125 ES', imgs:['https://www.honda.com.br/motos/sites/hda/files/2024-08/nova-carenagem-honda-biz-125-es_1560x624.webp','https://www.honda.com.br/motos/sites/hda/files/2024-08/novo-grafismo-honda-biz-125-es_1560x624.webp'], parcelas:{36:566.13,48:429.72,60:348.88,80:269.36} },
  { id:'CG160FAN', nome:'CG 160 FAN', imgs:['https://www.honda.com.br/motos/sites/hda/files/2025-08/visao-frontal-da-lateral-direita-da-honda-cg-160-fan.webp','https://www.honda.com.br/motos/sites/hda/files/2025-08/farol-da-moto-honda-cg-160-fan-.webp'], parcelas:{36:791.58,48:600.84,60:487.80,80:376.62} },
  { id:'CG160TITAN', nome:'CG 160 TITAN', imgs:['https://www.honda.com.br/motos/sites/hda/files/2025-08/visao-frontal-da-lateral-direita-da-honda-cg-160-titan.webp','https://www.honda.com.br/motos/sites/hda/files/2025-08/painel-da-moto-honda-cg-160-titan.webp'], parcelas:{36:841.45,48:638.70,60:518.54,80:400.35} },
  { id:'NXR160ABS', nome:'NXR 160 BROS ABS', imgs:['https://www.honda.com.br/motos/sites/hda/files/2025-07/Bros-Cinza-3_4FD-ABS.webp','https://www.honda.com.br/motos/sites/hda/files/2024-08/farol-honda-nxr-bros-160.webp'], parcelas:{36:947.23,48:718.99,60:583.73,80:450.68} }
];

const params = new URLSearchParams(location.search);
const moto = motos.find(m => m.id === params.get('moto')) || motos[0];

document.getElementById('tituloMoto').innerText = moto.nome;
document.getElementById('motoEscolhida').innerText = moto.nome;
document.getElementById('motoInput').value = moto.nome;

const track = document.getElementById('carouselTrack');
track.innerHTML = [...moto.imgs, ...moto.imgs].map(img => `<img src="${img}">`).join('');

const pSelect = document.getElementById('planoSelect');
Object.entries(moto.parcelas).forEach(([p,v]) => {
  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = `${p}x de R$ ${v.toFixed(2)}`;
  pSelect.appendChild(opt);
});

document.getElementById('consForm').addEventListener('submit', e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const msg = `*✅ NOVO CONSÓRCIO CPF APROVADO*\n\n*Moto:* ${d.moto}\n*Cliente:* ${d.nome}\n*CPF:* ${d.cpf}\n*Plano:* ${d.plano}x\n*Parcela Ideal:* R$ ${d.parcelaIdeal}\n*Pressa:* ${d.pressa}`;
  window.location.href = `https://wa.me/5594992781498?text=${encodeURIComponent(msg)}`;
});
</script>

</body>
</html>
