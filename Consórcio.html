<style>
/* --- VARIÁVEIS DE ESTILO (TEMA CPF APROVADO - AZUL E DOURADO) --- */
:root {
  --primary-bg: #00102a;
  --card-bg: rgba(255, 255, 255, 0.98);
  --honda-blue: #0044cc;
  --honda-dark-blue: #002266;
  --gold-accent: #ffcc00;
  --gold-dark: #cc9900;
  --text-dark: #001a33;
  --text-light: #555;
  --input-bg: #f0f4f8;
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.3);
}

body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background-color: var(--primary-bg);
  /* Gradiente Profissional */
  background: linear-gradient(135deg, #00102a 0%, #0044cc 100%);
  background-attachment: fixed;
  padding: 30px 20px;
  color: var(--text-dark);
  min-height: 100vh;
  box-sizing: border-box;
  position: relative;
}

/* Logo CPF Aprovado no Canto Superior Direito */
.logo-top {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 120px;
  z-index: 100;
  filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
  animation: pulseLogo 3s infinite alternate;
}

@keyframes pulseLogo {
  from { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,204,0,0.3)); }
  to { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,204,0,0.6)); }
}

@media (max-width: 600px) {
  .logo-top { width: 85px; top: 10px; right: 10px; }
  body { padding-top: 60px; }
}

.card {
  background: var(--card-bg);
  padding: 30px;
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  margin-bottom: 30px;
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  backdrop-filter: blur(10px);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Detalhe Dourado/Azul no Topo */
.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--gold-accent), var(--honda-blue), var(--gold-accent));
}

h2 {
  margin: 10px 0 20px;
  color: var(--honda-dark-blue);
  text-transform: uppercase;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.5px;
  text-align: center;
}

.moto-name {
  text-align: center;
  font-weight: 800;
  color: #fff;
  font-size: 1.1rem;
  background: linear-gradient(90deg, var(--honda-dark-blue), var(--honda-blue));
  padding: 12px 25px;
  border-radius: 50px;
  margin: 0 auto 25px auto;
  display: table;
  box-shadow: 0 4px 15px rgba(0, 68, 204, 0.3);
  text-transform: uppercase;
}

form {
  display: grid;
  gap: 15px;
}

label {
  font-weight: 700;
  color: var(--honda-dark-blue);
  font-size: 0.85rem;
  margin-bottom: -5px;
  display: flex;
  align-items: center;
  text-transform: uppercase;
}

input, select {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: 2px solid #e0e6ed;
  background-color: var(--input-bg);
  font-size: 15px;
  color: #333;
  font-family: 'Montserrat', sans-serif;
  transition: all 0.3s ease;
  box-sizing: border-box;
}

input:focus, select:focus {
  outline: none;
  background-color: #fff;
  border-color: var(--honda-blue);
  box-shadow: 0 0 0 4px rgba(0, 68, 204, 0.1);
}

/* Estilização específica para as bordas laterais */
input[name="nome"] { border-left: 6px solid var(--honda-blue); }
input[name="cpf"] { border-left: 6px solid var(--gold-accent); }

button {
  width: 100%;
  padding: 20px;
  background: linear-gradient(45deg, #128c7e, #25d366, #128c7e);
  background-size: 200% auto;
  border: none;
  margin-top: 25px;
  border-radius: 50px;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.4s ease;
  box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
  animation: pulseButton 3s infinite;
}

@keyframes pulseButton {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 25px rgba(37, 211, 102, 0.5);
}

/* CAROUSEL */
.carousel {
  width: 100%;
  height: 240px;
  overflow: hidden;
  border-radius: 16px;
  position: relative;
  background: #fff;
  border: 1px solid #eee;
}

.carousel-track {
  display: flex;
  width: max-content;
  animation: scrollInfinite 25s linear infinite;
}

.carousel-track img {
  width: 380px;
  height: 240px;
  object-fit: contain;
  padding: 15px;
  box-sizing: border-box;
  flex-shrink: 0;
}

@keyframes scrollInfinite {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* Responsividade */
@media (max-width: 480px) {
  .card { padding: 25px 20px; }
  h2 { font-size: 1.2rem; }
  .carousel-track img { width: 320px; height: 200px; }
  .carousel { height: 200px; }
}
</style>
</head>

  .join('');

/* PLANOS */
const planoSelect = document.getElementById('planoSelect');
planoSelect.innerHTML = '';

if(moto.parcelas){
  Object.entries(moto.parcelas).forEach(([p,v])=>{
    const opt=document.createElement('option');
    opt.value=p;
    opt.textContent=`${p}x de R$ ${v.toFixed(2)}`;
    planoSelect.appendChild(opt);
  });
}else{
  const opt=document.createElement('option');
  opt.value='A combinar';
  opt.textContent='Planos a combinar';
  planoSelect.appendChild(opt);
}

/* WHATSAPP */
consForm.addEventListener('submit',e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(consForm));
  const msg=
`*✅ SOLICITAÇÃO DE CONSÓRCIO - CPF APROVADO*
Moto: ${d.moto}
Nome: ${d.nome}
CPF: ${d.cpf}
Plano Escolhido: ${d.plano}
Parcela ideal: R$ ${d.parcelaIdeal}
Prioridade: ${d.pressa}`;
  location.href=`https://wa.me/5594992781498?text=${encodeURIComponent(msg)}`;
});
</script>
